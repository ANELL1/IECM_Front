<figure aria-label="Actas capturadas frente a pendientes">
  <figcaption><h2>Estado de captura</h2><p>Distribución del conjunto seleccionado</p></figcaption>
  <div class="donut">
    <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle cx="60" cy="60" r="48" fill="none" stroke="#eee9f2" stroke-width="12"/>@if (metrics().esperadas > 0) { <circle cx="60" cy="60" r="48" fill="none" stroke="#67418b" stroke-width="12" pathLength="100" [attr.stroke-dasharray]="dash()" transform="rotate(-90 60 60)"/> }</svg>
    <div class="center"><strong>{{ metrics().porcentaje | number:'1.2-2' }}%</strong><span>{{ metrics().esperadas ? 'avance global' : 'Sin datos' }}</span></div>
  </div>
  <dl><div><dt><span class="key captured" aria-hidden="true"></span>Capturadas</dt><dd>{{ metrics().capturadas | number }}</dd></div><div><dt><span class="key pending" aria-hidden="true"></span>Pendientes</dt><dd>{{ metrics().pendientes | number }}</dd></div></dl>
</figure>
